services:
  db:
    image: mongo:8.2  # pinned: data volume was created by 8.2.11
    restart: always
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    restart: always
    environment:
      - MONGO_URI=mongodb://db:27017/flightMonitor
      - PORT=5000
    depends_on:
      - db

  client:
    build: ./flight-monitor-client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo-data: