# MongoDB is the shared homelab database on central-db-server (CT 106).
# The connection string (with this app's user) lives in server/.env on docker-avi only.
services:
  server:
    build: ./server
    restart: always
    env_file: ./server/.env
    environment:
      - PORT=5000

  client:
    build: ./flight-monitor-client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server
